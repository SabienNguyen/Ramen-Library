services:
  app:
    build: .
    env_file: .env
    environment:
      # compose `environment` overrides values from `env_file`, so these
      # always win over whatever HOST/PORT/NODE_ENV a copied .env sets —
      # the container must bind 0.0.0.0:3000 to be reachable at all.
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Caddy always sets X-Forwarded-For, so the app can trust it for rate-limiting.
      TRUST_PROXY: "1"
    volumes:
      # Fallback local-disk upload storage when S3_ENDPOINT is unset.
      # Also holds a file: DATABASE_URL if you choose not to run sqld.
      - app-uploads:/app/data
    depends_on:
      sqld:
        condition: service_healthy
      garage:
        condition: service_healthy
    restart: unless-stopped

  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    command: ["sqld", "--http-listen-addr", "0.0.0.0:8080"]
    volumes:
      - sqld-data:/var/lib/sqld
    # No ports published to the host; only reachable from other
    # containers on the compose network at http://sqld:8080.
    healthcheck:
      # The image has neither curl nor wget, only bash — probe the HTTP
      # health endpoint with bash's /dev/tcp instead.
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v1.3.1
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    # No ports published to the host; the S3 API (garage:3900) and web
    # endpoint (garage:3902) are reached through Caddy or other containers.
    healthcheck:
      # The image has no shell, only the /garage binary itself — it exits
      # 0 once the node is up and reachable over RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app-uploads: {}
  sqld-data: {}
  garage-meta: {}
  garage-data: {}
  caddy-data: {}
  caddy-config: {}
